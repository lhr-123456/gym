server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: gym-management-system
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gym_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  
  # Redis 配置（如果没有安装 Redis，请注释掉整个 redis 部分）
  # 启动前请确保 Redis 已安装并运行
  # redis:
  #   host: localhost
  #   port: 6379
  #   password: 
  #   database: 0
  #   lettuce:
  #     pool:
  #       max-active: 8
  #       max-wait: -1ms
  #       max-idle: 8
  #       min-idle: 0
  
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gym.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: gym-management-system-secret-key-2024
  expiration: 86400000
  header: Authorization
  prefix: Bearer 

logging:
  level:
    com.gym: debug
    org.springframework.security: debug
    org.springframework.web.cors: debug
    org.springframework.web: debug